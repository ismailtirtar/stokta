# Retry 2: edits.commit performs validation; the separate validate endpoint is omitted.
name: Stokdaş Google Play One-Time Submit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google-play-submit-once.yml

concurrency:
  group: stokdas-google-play-submit-once
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  submit:
    name: Submit verified AAB to Google Play internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FUNCTION_URL: https://wewqrnpwqvnjusehxxtz.supabase.co/functions/v1/google-play-submit-once
      OIDC_AUDIENCE: stokdas-google-play-submit-v22

    steps:
      - name: Request GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          OIDC_TOKEN="$(jq -er '.value' <<<"$OIDC_RESPONSE")"
          echo "::add-mask::$OIDC_TOKEN"
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Invoke locked Google Play submit
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p submission-artifacts

          jq -n \
            --arg build_id "b6a28673-fd6f-454b-b874-3cf0ade3f568" \
            --arg git_commit "14d935c8e7bb15bd92233d15985dc930c1e7f07d" \
            --arg version "1.3.4" \
            --arg version_code "22" \
            --arg package_name "com.ismailtirtar.stokta" \
            --arg track "internal" \
            '{buildId: $build_id, gitCommitHash: $git_commit, appVersion: $version, appBuildVersion: $version_code, packageName: $package_name, track: $track}' \
            > submission-artifacts/request-provenance.json

          set +e
          HTTP_STATUS="$(curl --silent --show-error --location \
            --connect-timeout 20 --max-time 145 \
            --output submission-artifacts/response.json \
            --write-out '%{http_code}' \
            --request POST "$FUNCTION_URL" \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"confirm":"submit-stokdas-1.3.4-22-internal"}')"
          CURL_STATUS="$?"
          set -e

          echo "httpStatus=$HTTP_STATUS" | tee submission-artifacts/http-status.txt
          if [ -s submission-artifacts/response.json ]; then
            jq -c . submission-artifacts/response.json || cat submission-artifacts/response.json
          fi

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "::error::Supabase submission request failed with curl status $CURL_STATUS."
            exit "$CURL_STATUS"
          fi
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Supabase submission function returned HTTP $HTTP_STATUS."
            exit 1
          fi

          jq -e '
            .ok == true
            and .packageName == "com.ismailtirtar.stokta"
            and .track == "internal"
            and .appVersion == "1.3.4"
            and .versionCode == "22"
            and .buildId == "b6a28673-fd6f-454b-b874-3cf0ade3f568"
            and (.status == "uploaded_and_committed"
              or .status == "assigned_and_committed"
              or .status == "already_present")
          ' submission-artifacts/response.json >/dev/null

      - name: Upload submission evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stokdas-1.3.4-22-google-play-direct-submit
          path: submission-artifacts/
          if-no-files-found: error
          retention-days: 30
