name: Stokdaş Android Production

on:
  push:
    branches:
      - codex/stokdas-live-security-sync
    paths:
      - .github/eas-build-trigger
  workflow_dispatch:
    inputs:
      build_id:
        description: Existing successful EAS build ID to reuse
        required: false
        type: string

concurrency:
  group: stokdas-eas-android-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      REQUESTED_BUILD_ID: ${{ inputs.build_id || '' }}

    steps:
      - name: Check Expo authentication
        id: expo_auth
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN is not configured; EAS build was safely skipped."
          fi

      - name: Checkout PR source
        if: steps.expo_auth.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.expo_auth.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.expo_auth.outputs.available == 'true'
        run: npm ci

      - name: Verify TypeScript
        if: steps.expo_auth.outputs.available == 'true'
        run: npm run typecheck

      - name: Set up EAS CLI
        if: steps.expo_auth.outputs.available == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: 23.0.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve successful EAS build
        if: steps.expo_auth.outputs.available == 'true'
        id: eas_build
        shell: bash
        run: |
          BUILD_ID="$REQUESTED_BUILD_ID"
          if [ -z "$BUILD_ID" ] && [ -f .github/eas-build-trigger ]; then
            BUILD_ID="$(sed -n 's/^build_id=//p' .github/eas-build-trigger | head -n 1 | tr -d '\r')"
          fi

          if [ -z "$BUILD_ID" ]; then
            eas build --platform android --profile production --non-interactive --wait --json > eas-build-submit.json
            BUILD_ID="$(jq -r 'if type == "array" then .[0].id else .id end' eas-build-submit.json)"
          else
            echo "::notice::Reusing successful EAS build $BUILD_ID."
          fi

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::EAS build ID could not be determined."
            exit 1
          fi

          eas build:view "$BUILD_ID" --json > eas-build.json
          STATUS="$(jq -r '.status // empty' eas-build.json)"
          PLATFORM="$(jq -r '.platform // empty' eas-build.json)"
          if [ "$STATUS" != "FINISHED" ] || [ "$PLATFORM" != "ANDROID" ]; then
            echo "::error::EAS build is not a finished Android build (status=$STATUS, platform=$PLATFORM)."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download and verify signed AAB
        if: steps.expo_auth.outputs.available == 'true'
        shell: bash
        env:
          BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
        run: |
          AAB_URL="$(jq -r '.artifacts.applicationArchiveUrl // empty' eas-build.json)"
          if [ -z "$AAB_URL" ]; then
            echo "::error::EAS build has no application archive URL."
            exit 1
          fi

          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 30 --output stokdas-1.3.3.aab "$AAB_URL"
          if [ ! -s stokdas-1.3.3.aab ]; then
            echo "::error::Downloaded AAB is empty or missing."
            exit 1
          fi
          unzip -tq stokdas-1.3.3.aab
          sha256sum stokdas-1.3.3.aab > stokdas-1.3.3.aab.sha256
          echo "EAS build: $BUILD_ID"

      - name: Upload AAB artifact
        if: steps.expo_auth.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stokdas-1.3.3-android-aab
          path: |
            stokdas-1.3.3.aab
            stokdas-1.3.3.aab.sha256
            eas-build.json
          if-no-files-found: error
          retention-days: 30
