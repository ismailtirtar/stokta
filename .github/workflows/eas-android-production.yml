name: Stokdaş Android Production

on:
  push:
    branches:
      - codex/stokdas-live-security-sync
    paths:
      - .github/workflows/eas-android-production.yml
      - .github/eas-build-trigger
  workflow_dispatch:

concurrency:
  group: stokdas-eas-android-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check Expo authentication
        id: expo_auth
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN is not configured; EAS build was safely skipped."
          fi

      - name: Checkout PR source
        if: steps.expo_auth.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.expo_auth.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.expo_auth.outputs.available == 'true'
        run: npm ci

      - name: Verify TypeScript
        if: steps.expo_auth.outputs.available == 'true'
        run: npm run typecheck

      - name: Set up EAS CLI
        if: steps.expo_auth.outputs.available == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: 23.0.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Stokdaş production AAB
        if: steps.expo_auth.outputs.available == 'true'
        id: eas_build
        shell: bash
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
          BUILD_ID="$(jq -r 'if type == "array" then .[0].id else .id end' eas-build.json)"
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::EAS build ID could not be determined."
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download signed AAB
        if: steps.expo_auth.outputs.available == 'true'
        id: download
        shell: bash
        run: |
          eas build:download --build-id "${{ steps.eas_build.outputs.build_id }}" --non-interactive --json > eas-download.json
          AAB_PATH="$(jq -r '.path' eas-download.json)"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Downloaded AAB was not found."
            exit 1
          fi
          cp "$AAB_PATH" stokdas-1.3.3.aab
          sha256sum stokdas-1.3.3.aab > stokdas-1.3.3.aab.sha256

      - name: Upload AAB artifact
        if: steps.expo_auth.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stokdas-1.3.3-android-aab
          path: |
            stokdas-1.3.3.aab
            stokdas-1.3.3.aab.sha256
            eas-build.json
          if-no-files-found: error
          retention-days: 30
