name: Source snapshot for audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build tracked source archive
        run: git archive --format=tar.gz --output=stokdas-source.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: stokdas-source
          path: stokdas-source.tar.gz
          if-no-files-found: error
          retention-days: 1
