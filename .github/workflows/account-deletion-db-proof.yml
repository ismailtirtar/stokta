name: Stokdaş account deletion DB proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/schema.sql'
      - 'supabase/migrations/**'
      - 'tests/account-deletion-payment-db.sql'
      - 'tests/account-deletion-payment-race.sh'
      - '.github/workflows/account-deletion-db-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0

      - name: Replay baseline and migrations against isolated Supabase Postgres
        run: |
          cp supabase/schema.sql supabase/migrations/20260821000000_ci_baseline.sql
          supabase db start

      - name: Install PostgreSQL client if unavailable
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prove payment guard and database rollback
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f tests/account-deletion-payment-db.sql

      - name: Prove both concurrent payment and deletion lock orders
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
          DISPOSABLE_DB: YES
        run: bash tests/account-deletion-payment-race.sh
